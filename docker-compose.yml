services:
  postgres:
    image: postgres:16-alpine
    container_name: stringtracker-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - stringtracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stringtracker-minio
    restart: unless-stopped
    env_file:
      - .env
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stringtracker_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cria o bucket de fotos de perfil na primeira subida
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: stringtracker-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'Aguardando MinIO…';
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        sleep 1;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET_AVATARS;
      mc anonymous set download local/$$MINIO_BUCKET_AVATARS;
      echo \"Bucket $$MINIO_BUCKET_AVATARS pronto.\";
      "

  keycloak:
    profiles: ["full"]
    image: quay.io/keycloak/keycloak:26.0
    container_name: stringtracker-keycloak
    restart: unless-stopped
    env_file:
      - .env
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-stringtracker.json:/opt/keycloak/data/import/realm-stringtracker.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stringtracker_pg:
  stringtracker_minio:
