# Padel Match API: docker-compose.prod.yml publica a API em 127.0.0.1:8080.
server {
    listen 80;
    listen [::]:80;
    server_name padel.kameziro.com.br;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name padel.kameziro.com.br;

    ssl_certificate /etc/letsencrypt/live/padel.kameziro.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padel.kameziro.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Mesmo limite da API (quarkus.http.limits.max-body-size): upload de fotos.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
