# Datasource — PostgreSQL (valores via .env — ver .env.example)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# HTTP
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

# CORS — Expo / Metro local
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Keycloak OIDC (bearer service)
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}

# Keycloak tokens are validated by quarkus-oidc (smallrye-jwt kept on classpath per project request)
quarkus.smallrye-jwt.enabled=false

# Test profile — H2 + JWT test security (no real Keycloak / .env secrets)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:stringtracker;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/disabled-for-tests
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.credentials.secret=test
%test.quarkus.oidc.token.issuer=http://localhost:8180/realms/disabled-for-tests
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.http.auth.proactive=false
%test.quarkus.smallrye-jwt.enabled=true
