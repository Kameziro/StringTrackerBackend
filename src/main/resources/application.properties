quarkus.datasource.db-kind=postgresql
# Nos testes não há datasource configurado: o Dev Services sobe um Postgres (Testcontainers).
%dev,prod.quarkus.datasource.username=${POSTGRES_USER}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%dev,prod.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.limits.max-body-size=10M

# MinIO (fotos de perfil)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:change-me-minio}
minio.bucket.avatars=${MINIO_BUCKET_AVATARS:padelmatch-avatars}
minio.region=${MINIO_REGION:us-east-1}
# Avatars são expostos via GET /api/media/avatars/... (proxy). MINIO_PUBLIC_BASE_URL não é mais usado.

# Chave AES-256 (32 bytes em Base64) que cifra os tokens OAuth dos clubes. Sem ela a API não sobe.
# Gere com: openssl rand -base64 32
token.cipher.key=${TOKEN_CIPHER_KEY}
%test.token.cipher.key=dGVzdC1vbmx5LXRva2VuLWNpcGhlci1rZXktMzJieXQ=

# E-mail (convites): em dev e test nada é enviado, as mensagens ficam no MockMailbox
%dev,test.quarkus.mailer.mock=true

# Expo Push API
quarkus.rest-client.expo-push.url=https://exp.host

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}

# BFF login → IdP password grant (mobile nunca fala com Keycloak)
auth.keycloak.token-url=${OIDC_AUTH_SERVER_URL}/protocol/openid-connect/token
auth.keycloak.client-id=${AUTH_KEYCLOAK_CLIENT_ID:stringtracker-expo}
auth.keycloak.realm=${AUTH_KEYCLOAK_REALM:stringtracker}
auth.keycloak.admin-base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8180}
auth.keycloak.admin-username=${KEYCLOAK_ADMIN:admin}
auth.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
quarkus.rest-client.keycloak-token.url=${auth.keycloak.token-url}
quarkus.rest-client.keycloak-admin.url=${auth.keycloak.admin-base-url}

quarkus.smallrye-jwt.enabled=false

# Os testes validam o mapeamento das entidades contra o schema das migrações
%test.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/disabled-for-tests
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.credentials.secret=test
%test.quarkus.oidc.token.issuer=http://localhost:8180/realms/disabled-for-tests
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.http.auth.proactive=false
%test.quarkus.smallrye-jwt.enabled=true
%test.auth.keycloak.token-url=http://localhost:8180/realms/stringtracker/protocol/openid-connect/token
%test.auth.keycloak.client-id=stringtracker-expo
%test.auth.keycloak.realm=stringtracker
%test.auth.keycloak.admin-base-url=http://localhost:8180
%test.auth.keycloak.admin-username=admin
%test.auth.keycloak.admin-password=change-me-admin
%test.quarkus.rest-client.keycloak-token.url=http://localhost:8180/realms/stringtracker/protocol/openid-connect/token
%test.quarkus.rest-client.keycloak-admin.url=http://localhost:8180
